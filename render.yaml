services:
  - type: web
    name: canecare-api
    env: python
    buildCommand: "cd canecare-backend && pip install -r requirements.txt"
    startCommand: "cd canecare-backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: ALLOWED_ORIGINS
        value: "*"

